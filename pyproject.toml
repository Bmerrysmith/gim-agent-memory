[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gim-agent-memory"
version = "0.1.0"
description = "Reproducible foundations for Geometric Intergenerational Memory"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gim = "gim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/gim"]

[tool.ruff]
target-version = "py311"
line-length = 100
